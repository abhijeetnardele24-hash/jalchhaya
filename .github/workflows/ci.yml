name: CI Quality & Verification Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Vitest Unit Coverage (>85% Threshold)
        run: npm test

      - name: Dependency Vulnerability Audit
        run: npm run audit

      - name: Production Vite Build
        run: npm run build

      - name: Secret & Credential Scan
        run: npm run security-scan

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & WCAG 2.2 AA Audits
        run: npm run test:e2e
