<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF7F2; }
      .zone-box { fill: #FFFFFF; stroke: #D0C7B8; stroke-width: 1.5; rx: 8; }
      .zone-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #132A2E; letter-spacing: 0.5px; }
      .box { fill: #FFFFFF; stroke: #19A7B8; stroke-width: 1.5; rx: 6; }
      .box-accent { fill: #EBF8FA; stroke: #086F83; stroke-width: 1.5; rx: 6; }
      .box-arkiv { fill: #0E2226; stroke: #19A7B8; stroke-width: 1.5; rx: 6; }
      .box-offline { fill: #FFF9F0; stroke: #D97706; stroke-width: 1.5; rx: 6; }
      .box-verifier { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; rx: 6; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #132A2E; }
      .txt-arkiv { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #EBF8FA; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #5A6A6D; }
      .txt-arkiv-sub { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9.5px; fill: #7AD1DC; }
      .txt-code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9.5px; fill: #086F83; font-weight: 600; }
      .arrow { stroke: #086F83; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dashed { stroke: #D97706; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
      .arrow-ws { stroke: #16A34A; stroke-width: 1.5; fill: none; }
      .label-pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #086F83; }
      .tag-bg { fill: #EBF8FA; stroke: #7AD1DC; stroke-width: 1; rx: 3; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#086F83" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706" />
    </marker>
    <marker id="arrowhead-ws" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="560" class="bg" rx="12" />

  <!-- Diagram Title Header -->
  <text x="32" y="38" class="zone-header" style="font-size: 15px; letter-spacing: 0.2px;">JALCHHAYA ARCHITECTURE &amp; VERIFIED CODE PATHS</text>
  <text x="32" y="55" class="txt-sub">Authoritative Arkiv Tiramisu data flow, wallet-signed state transitions, offline resilience, and independent verification</text>

  <!-- ZONE 1: BROWSER / CLIENT LAYER -->
  <rect x="24" y="75" width="280" height="465" class="zone-box" />
  <text x="40" y="100" class="zone-header">1. FIELD CLIENT (REACT + TS PWA)</text>

  <!-- PWA Shell & Service Worker -->
  <rect x="40" y="115" width="248" height="60" class="box-offline" />
  <text x="52" y="135" class="txt-title">Service Worker &amp; App Cache</text>
  <text x="52" y="150" class="txt-sub">public/sw.js · Stale-while-revalidate</text>
  <text x="52" y="163" class="txt-sub">Navigation fallback &amp; offline read storage</text>

  <!-- View Layer -->
  <rect x="40" y="185" width="248" height="75" class="box" />
  <text x="52" y="205" class="txt-title">Wayfinding &amp; Civic UI</text>
  <text x="52" y="220" class="txt-sub">ZoneMap (Geohash-5) · ReliefBoard</text>
  <text x="52" y="233" class="txt-sub">IncidentBanner · Multilingual (EN/MR/HI)</text>
  <text x="52" y="246" class="txt-code">&lt;Header&gt; Offline / Degraded State</text>

  <!-- User Action / Write Modals -->
  <rect x="40" y="270" width="248" height="95" class="box-accent" />
  <text x="52" y="290" class="txt-title">Wallet-Signed Field Submissions</text>
  <text x="52" y="305" class="txt-code">ObservationModal.tsx</text>
  <text x="52" y="318" class="txt-sub">Ground availability status (TTL 2h-4h)</text>
  <text x="52" y="333" class="txt-code">AttestationModal.tsx</text>
  <text x="52" y="346" class="txt-sub">Independent peer confirm / challenge ($creator)</text>
  <text x="52" y="358" class="txt-sub" style="fill: #9E261B; font-weight: 600;">* Offline write-blocking enforced</text>

  <!-- Inspection Drawer -->
  <rect x="40" y="375" width="248" height="65" class="box" />
  <text x="52" y="395" class="txt-title">On-Chain Evidence Inspector</text>
  <text x="52" y="410" class="txt-sub">EvidenceInspector.tsx (Lazy Chunk)</text>
  <text x="52" y="423" class="txt-sub">Entity key inspection, TTL countdown, SDK query</text>

  <!-- User Wallet -->
  <rect x="40" y="450" width="248" height="70" class="box-accent" />
  <text x="52" y="470" class="txt-title">EVM Wallet Provider</text>
  <text x="52" y="485" class="txt-sub">window.ethereum (MetaMask / injected)</text>
  <text x="52" y="498" class="txt-code">Viem 2.21.32 Client Wallet Account</text>
  <text x="52" y="511" class="txt-sub">Signs EIP-1193 transactions locally</text>

  <!-- ZONE 2: SERVICE & INTEGRATION LAYER -->
  <rect x="330" y="75" width="270" height="465" class="zone-box" />
  <text x="346" y="100" class="zone-header">2. DATA LAYER (arkivService.ts)</text>

  <!-- Query Engine -->
  <rect x="346" y="115" width="238" height="90" class="box-accent" />
  <text x="358" y="135" class="txt-title">Compound Query Engine</text>
  <text x="358" y="150" class="txt-code">fetchReliefPointsWithTruth()</text>
  <text x="358" y="165" class="txt-sub">Multi-predicate typed attribute filtering:</text>
  <text x="358" y="178" class="txt-code">eq("project_id", "jalchhaya-pune-2026")</text>
  <text x="358" y="191" class="txt-code">attributes: true (Typed predicates)</text>

  <!-- State & Degraded Handler -->
  <rect x="346" y="215" width="238" height="75" class="box-offline" />
  <text x="358" y="235" class="txt-title">Resilience &amp; Source Attribution</text>
  <text x="358" y="250" class="txt-sub">Source tagger: LIVE | DEMO | DEGRADED</text>
  <text x="358" y="265" class="txt-sub">Catches 429 ANON_COST_LIMITED</text>
  <text x="358" y="278" class="txt-sub">Zero mock misrepresentation guarantee</text>

  <!-- Mutation Engine -->
  <rect x="346" y="300" width="238" height="85" class="box" />
  <text x="358" y="320" class="txt-title">Mutation &amp; Broadcast Engine</text>
  <text x="358" y="335" class="txt-code">publishObservation() / publishAttest()</text>
  <text x="358" y="350" class="txt-sub">1. Pre-validates schema &amp; relational key</text>
  <text x="358" y="363" class="txt-sub">2. Encodes attributes with string/uint/bool</text>
  <text x="358" y="376" class="txt-sub">3. Post-tx entity query verification</text>

  <!-- WebSocket Manager -->
  <rect x="346" y="395" width="238" height="65" class="box-verifier" />
  <text x="358" y="415" class="txt-title">WebSocket Block Listener</text>
  <text x="358" y="430" class="txt-code">arkivConnectionManager</text>
  <text x="358" y="443" class="txt-sub">watchEntityEvents() · Real-time feeds</text>
  <text x="358" y="455" class="txt-sub">Automatic exponential-backoff reconnect</text>

  <!-- Verifier Module -->
  <rect x="346" y="470" width="238" height="55" class="box-verifier" />
  <text x="358" y="490" class="txt-title">Pure Verifier Core</text>
  <text x="358" y="505" class="txt-code">src/lib/verifierCore.ts</text>
  <text x="358" y="517" class="txt-sub">Validates schemas, creator, &amp; references</text>

  <!-- ZONE 3: ARKIV TESTNET & VERIFICATION -->
  <rect x="626" y="75" width="310" height="465" class="zone-box" style="fill: #0B191B; stroke: #19A7B8;" />
  <text x="642" y="100" class="zone-header" style="fill: #7AD1DC;">3. ARKIV TIRAMISU (CHAIN ID 7738577)</text>

  <!-- Entity: relief_point -->
  <rect x="642" y="115" width="278" height="75" class="box-arkiv" />
  <text x="654" y="135" class="txt-arkiv">relief_point (Long-Lived Facility)</text>
  <text x="654" y="150" class="txt-arkiv-sub">TTL: 180 Days · Permissionless Extension: true</text>
  <text x="654" y="163" class="txt-arkiv-sub">Attributes: city, zone, geohash5, resource_type</text>
  <text x="654" y="176" class="txt-arkiv-sub">Indexed attributes for compound spatial queries</text>

  <!-- Entity: availability_observation -->
  <rect x="642" y="198" width="278" height="75" class="box-arkiv" />
  <text x="654" y="218" class="txt-arkiv">availability_observation (Ground Status)</text>
  <text x="654" y="233" class="txt-arkiv-sub">TTL: 2 to 4 Hours (Native Entity Expiration)</text>
  <text x="654" y="246" class="txt-arkiv-sub">Attributes: relief_point_key, status, observed_at</text>
  <text x="654" y="259" class="txt-arkiv-sub">Auto-evicted on expiry; prevents stale relief claims</text>

  <!-- Entity: attestation -->
  <rect x="642" y="281" width="278" height="75" class="box-arkiv" />
  <text x="654" y="301" class="txt-arkiv">attestation (Independent Peer Review)</text>
  <text x="654" y="316" class="txt-arkiv-sub">Immutable $creator provenance</text>
  <text x="654" y="329" class="txt-arkiv-sub">Attributes: verdict (confirm/challenge), ref_keys</text>
  <text x="654" y="342" class="txt-arkiv-sub">Anti-sybil peer validation layer</text>

  <!-- Network Endpoints -->
  <rect x="642" y="364" width="278" height="75" class="box-arkiv" style="border: 1px dashed #7AD1DC;" />
  <text x="654" y="384" class="txt-arkiv">Tiramisu Testnet Gateway</text>
  <text x="654" y="399" class="txt-arkiv-sub">JSON-RPC: https://rpc.tiramisu... (Block #736045)</text>
  <text x="654" y="412" class="txt-arkiv-sub">WebSocket: wss://rpc.tiramisu... (Live events)</text>
  <text x="654" y="425" class="txt-arkiv-sub">Explorer: https://explorer.tiramisu...</text>

  <!-- Autonomous CLI Verifier -->
  <rect x="642" y="447" width="278" height="78" class="box-arkiv" style="fill: #064E3B; stroke: #34D399;" />
  <text x="654" y="467" class="txt-arkiv" style="fill: #A7F3D0;">scripts/verify-onchain.ts (CLI Gate)</text>
  <text x="654" y="482" class="txt-arkiv-sub" style="fill: #D1FAE5;">1. Tests RPC reachability &amp; Chain ID 7738577</text>
  <text x="654" y="495" class="txt-arkiv-sub" style="fill: #D1FAE5;">2. Selects attributes: true + all verified fields</text>
  <text x="654" y="508" class="txt-arkiv-sub" style="fill: #D1FAE5;">3. Strict relational verification; exits 1 on error</text>

  <!-- ARROWS / DATA FLOW CONNECTORS -->
  <!-- Browser to Data Layer: Query -->
  <path d="M 288 220 L 346 150" class="arrow" marker-end="url(#arrowhead)" />
  <!-- Data Layer to Arkiv: RPC Query -->
  <path d="M 584 150 L 642 150" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Wallet to Mutation Engine -->
  <path d="M 288 480 L 346 345" class="arrow" marker-end="url(#arrowhead)" />
  <!-- Mutation Engine to Arkiv -->
  <path d="M 584 345 L 642 345" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Arkiv WebSocket to Client -->
  <path d="M 642 410 L 584 415" class="arrow-ws" marker-end="url(#arrowhead-ws)" />
  <path d="M 346 425 L 288 245" class="arrow-ws" marker-end="url(#arrowhead-ws)" />

  <!-- Offline Fallback -->
  <path d="M 346 250 L 288 150" class="arrow-dashed" marker-end="url(#arrowhead-dashed)" />

  <!-- Verifier to Gateway -->
  <path d="M 584 495 L 642 485" class="arrow" marker-end="url(#arrowhead)" />

</svg>
